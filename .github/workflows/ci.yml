name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to validate and package for publication
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Validate release version
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_TAG -ValidateOnly

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\install.Tests.ps1

      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: .\tests\install.Tests.ps1

      - name: Build (release)
        run: cargo build --locked --release --workspace

      - name: Test release packaging
        run: .\tests\package-release.Tests.ps1

      - name: Package release assets
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_TAG

      - name: Upload release assets
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
